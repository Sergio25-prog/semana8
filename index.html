<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Tecnología | Ofertas de la Semana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menú de Navegación Flexible -->
    <header class="header">
        <div class="header__logo">TechStore</div>
        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item"><a href="#" class="nav__link">Inicio</a></li>
                <li class="nav__item"><a href="#" class="nav__link">Productos</a></li>
                <li class="nav__item"><a href="#" class="nav__link">Servicios</a></li>
                <li class="nav__item"><a href="#" class="nav__link">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- Sección de Ofertas de la Semana -->
    <main class="main-content">
        <section class="offers">
            <h1 class="offers__title">Ofertas de la Semana</h1>
            
            <!-- Contenedor Flexible de la Galería -->
            <div class="gallery">
                <article class="gallery__item">
                    <img src="https://via.placeholder.com/300x200" alt="Laptop Gamer" class="gallery__img">
                    <h3 class="gallery__product-name">Laptop Gamer RTX</h3>
                    <p class="gallery__price">$1.200.000</p>
                </article>
                
                <article class="gallery__item">
                    <img src="https://via.placeholder.com/300x200" alt="Smartphone 5G" class="gallery__img">
                    <h3 class="gallery__product-name">Smartphone 5G Pro</h3>
                    <p class="gallery__price">$850.000</p>
                </article>

                <article class="gallery__item">
                    <img src="https://via.placeholder.com/300x200" alt="Audífonos Inalámbricos" class="gallery__img">
                    <h3 class="gallery__product-name">Audífonos Noise Cancelling</h3>
                    <p class="gallery__price">$150.000</p>
                </article>
                
                <article class="gallery__item">
                    <img src="https://via.placeholder.com/300x200" alt="Monitor Curvo" class="gallery__img">
                    <h3 class="gallery__product-name">Monitor Curvo 144Hz</h3>
                    <p class="gallery__price">$250.000</p>
                </article>
            </div>
        </section>
    </main>

</body>
</html>
